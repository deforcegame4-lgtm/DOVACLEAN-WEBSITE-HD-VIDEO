<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOVACLEAN - Membuat Video Jernih Dan HD</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Poppins', sans-serif;
  }

  html, body {
    height: 100%;
    background: radial-gradient(circle at top left, #0f2027, #203a43, #2c5364);
    background-attachment: fixed;
    color: #fff;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    position: relative;
  }

  /* Floating background blobs for depth */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    z-index: 0;
    animation: float 12s ease-in-out infinite;
  }
  .blob1 {
    width: 350px; height: 350px;
    background: #00c6ff;
    top: -100px; left: -100px;
  }
  .blob2 {
    width: 300px; height: 300px;
    background: #0072ff;
    bottom: -80px; right: -80px;
    animation-delay: 3s;
  }
  .blob3 {
    width: 250px; height: 250px;
    background: #00fff0;
    top: 40%; right: 10%;
    animation-delay: 6s;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-30px) scale(1.05); }
  }

  /* Logo */
  header {
    position: relative;
    z-index: 2;
    padding: 20px 24px;
  }
  .logo {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.5px;
    background: linear-gradient(90deg, #00f2fe, #4facfe, #00c6ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
    text-transform: uppercase;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    z-index: 2;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(25px) saturate(180%);
    -webkit-backdrop-filter: blur(25px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 28px;
    padding: 32px 24px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    position: relative;
  }

  .upload-box {
    border: 2px dashed rgba(255, 255, 255, 0.25);
    border-radius: 20px;
    padding: 45px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    background: rgba(255, 255, 255, 0.03);
  }
  .upload-box:hover {
    border-color: #4facfe;
    background: rgba(79, 172, 254, 0.08);
    transform: scale(1.01);
  }
  .upload-box.dragover {
    border-color: #00f2fe;
    background: rgba(0, 242, 254, 0.12);
  }

  .cloud-icon {
    width: 70px;
    height: 70px;
    margin: 0 auto 16px;
    animation: bounce 2.5s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .upload-text {
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }
  .upload-subtext {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
  }

  #fileInput { display: none; }

  .file-preview {
    margin-top: 12px;
    font-size: 13px;
    color: #4facfe;
    word-break: break-all;
    display: none;
  }

  /* Dropdown Pilih Fitur */
  .dropdown {
    margin-top: 20px;
    position: relative;
  }
  .dropdown-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 14px 18px;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .dropdown-btn:hover {
    background: rgba(255, 255, 255, 0.13);
  }
  .dropdown-arrow {
    transition: transform 0.3s ease;
    font-size: 12px;
  }
  .dropdown-btn.active .dropdown-arrow {
    transform: rotate(180deg);
  }

  .dropdown-content {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.35s ease, opacity 0.3s ease, margin-top 0.3s ease;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px);
    border-radius: 16px;
    margin-top: 0;
  }
  .dropdown-content.show {
    max-height: 260px;
    opacity: 1;
    margin-top: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .feature-option {
    padding: 13px 18px;
    font-size: 13.5px;
    cursor: pointer;
    transition: background 0.2s ease;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .feature-option:last-child { border-bottom: none; }
  .feature-option:hover {
    background: rgba(79, 172, 254, 0.15);
  }
  .feature-option.selected {
    background: rgba(0, 242, 254, 0.18);
    color: #00f2fe;
    font-weight: 600;
  }

  /* Up Now Button - Glass iOS */
  .upnow-btn {
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    border: none;
    border-radius: 18px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, rgba(79,172,254,0.35), rgba(0,242,254,0.25));
    backdrop-filter: blur(20px) saturate(200%);
    -webkit-backdrop-filter: blur(20px) saturate(200%);
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 4px 20px rgba(0, 198, 255, 0.25), inset 0 1px 1px rgba(255,255,255,0.4);
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .upnow-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s ease;
  }
  .upnow-btn:hover::before { left: 100%; }
  .upnow-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(0, 198, 255, 0.4);
  }
  .upnow-btn:active {
    transform: translateY(0px) scale(0.98);
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal-overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .modal-box {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(25px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 22px;
    padding: 28px 26px;
    text-align: center;
    max-width: 320px;
    width: 90%;
    transform: scale(0.85) translateY(20px);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .modal-overlay.show .modal-box {
    transform: scale(1) translateY(0);
  }

  .modal-icon {
    font-size: 40px;
    margin-bottom: 10px;
  }

  .modal-text {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 20px;
    color: #fff;
  }

  .modal-ok-btn {
    background: linear-gradient(135deg, rgba(79,172,254,0.4), rgba(0,242,254,0.3));
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 10px 40px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .modal-ok-btn:hover {
    background: rgba(79,172,254,0.55);
    transform: scale(1.05);
  }

  footer {
    text-align: center;
    padding: 16px;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    position: relative;
    z-index: 2;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<header>
  <span class="logo">DOVACLEAN</span>
</header>

<main>
  <div class="card">
    <div class="upload-box" id="uploadBox">
      <svg class="cloud-icon" viewBox="0 0 64 64" fill="none">
        <defs>
          <linearGradient id="cloudGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00f2fe"/>
            <stop offset="100%" stop-color="#4facfe"/>
          </linearGradient>
        </defs>
        <path d="M46 40H18c-6 0-11-5-11-11s5-11 11-11c1 0 2 .1 3 .3C22.5 12.5 27 9 32 9c6.6 0 12 5.4 12 12 0 .7-.1 1.4-.2 2C48.5 24 52 27.8 52 32.5 52 36.6 49.6 40 46 40z" 
          stroke="url(#cloudGrad)" stroke-width="2.5" fill="rgba(79,172,254,0.08)"/>
        <path d="M32 28v18M32 28l-6 6M32 28l6 6" stroke="url(#cloudGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="upload-text">Upload Foto/Video</div>
      <div class="upload-subtext">Klik atau tarik file ke sini</div>
      <div class="file-preview" id="filePreview"></div>
    </div>
    <input type="file" id="fileInput" accept="image/*,video/*">

    <div class="dropdown">
      <div class="dropdown-btn" id="dropdownBtn">
        <span id="dropdownLabel">Pilih Fitur</span>
        <span class="dropdown-arrow">▲</span>
      </div>
      <div class="dropdown-content" id="dropdownContent">
        <!-- dikosongkan dulu sesuai permintaan, tinggal isi option di sini nanti -->
      </div>
    </div>

    <button class="upnow-btn" id="upNowBtn">Up Now</button>
  </div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-icon">⚠️</div>
    <div class="modal-text">Gagal! Kamu Mungkin Belum Mengisi Sesuatu</div>
    <button class="modal-ok-btn" id="modalOkBtn">Oke</button>
  </div>
</div>

<footer>DOVACLEAN - Dibuat Oleh Xylon.</footer>

<script>
  const uploadBox = document.getElementById('uploadBox');
  const fileInput = document.getElementById('fileInput');
  const filePreview = document.getElementById('filePreview');
  const dropdownBtn = document.getElementById('dropdownBtn');
  const dropdownContent = document.getElementById('dropdownContent');
  const dropdownLabel = document.getElementById('dropdownLabel');
  const upNowBtn = document.getElementById('upNowBtn');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalOkBtn = document.getElementById('modalOkBtn');

  let selectedFile = null;
  let selectedFeature = null;

  // Upload klik
  uploadBox.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      selectedFile = e.target.files[0];
      filePreview.style.display = 'block';
      filePreview.textContent = '📎 ' + selectedFile.name;
    }
  });

  // Drag & drop
  uploadBox.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadBox.classList.add('dragover');
  });
  uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('dragover'));
  uploadBox.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadBox.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
      selectedFile = e.dataTransfer.files[0];
      filePreview.style.display = 'block';
      filePreview.textContent = '📎 ' + selectedFile.name;
    }
  });

  // Dropdown toggle (buka ke bawah)
  dropdownBtn.addEventListener('click', () => {
    dropdownContent.classList.toggle('show');
    dropdownBtn.classList.toggle('active');
  });

  // Contoh handler kalau nanti mau isi option secara dinamis:
  // dropdownContent.innerHTML = `<div class="feature-option" data-value="hd">Tingkatkan ke HD</div>`;
  // lalu tambahkan event listener klik untuk tiap .feature-option

  function selectFeature(el, value, label) {
    document.querySelectorAll('.feature-option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    selectedFeature = value;
    dropdownLabel.textContent = label;
    dropdownContent.classList.remove('show');
    dropdownBtn.classList.remove('active');
  }

  // Up Now button
  upNowBtn.addEventListener('click', () => {
    if (!selectedFile || !selectedFeature) {
      modalOverlay.classList.add('show');
      return;
    }
    // proses upload/HD di sini
    alert('Memproses ' + selectedFile.name + ' dengan fitur ' + selectedFeature);
  });

  // Modal close smooth
  modalOkBtn.addEventListener('click', () => {
    modalOverlay.classList.remove('show');
  });
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) modalOverlay.classList.remove('show');
  });
</script>

</body>
</html>
